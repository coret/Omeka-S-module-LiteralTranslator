[info]
version = "1.0.0"
omeka_version_constraint = "^4.0.0"
name = "Literal Translator"
description = "Adds a translate button to every literal value on the resource form. Pick a target language and the DeepL translation is added as a new value, tagged with that language."
author = "Bob Coret"
license = "GPL-3.0-or-later"
author_link = "https://github.com/coret"
configurable = true
module_link = "https://github.com/coret/Omeka-S-module-LiteralTranslator"
support_link = "https://github.com/coret/Omeka-S-module-LiteralTranslator/issues"
